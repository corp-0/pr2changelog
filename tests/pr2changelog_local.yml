name: pr2changelog
on:
    pull_request_target:
        branches:
            - master
        types:
            - closed
            - edited

jobs:
    dry_check:
        if: github.event.pull_request.merged == false

        name: changelog generator dry check
        runs-on: ubuntu-latest

        steps:
            -   run: echo testing dry_check
            -   name: Checkout repository
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: pr2changelog
                id: pr2changelog
                uses: ./
                with:
                    categories: Fix;New;Improvement
            -   run: printf '%s\n' "$CHANGELOG_CONTENT"
                env:
                    CHANGELOG_CONTENT: ${{ steps.pr2changelog.outputs.changelog_content }}

    after_merge:
        if: github.event.pull_request.merged == true

        name: changelog generator
        runs-on: ubuntu-latest

        steps:
            -   run: echo testing after merge job
            -   name: Checkout repository
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: pr2changelog
                id: pr2changelog
                uses: ./
                with:
                    categories: Fix;New;Improvement
            -   run: printf '%s\n' "$CHANGELOG_CONTENT"
                env:
                    CHANGELOG_CONTENT: ${{ steps.pr2changelog.outputs.changelog_content }}
